name: crash-data-probe
on:
  push:
    branches: ["claude/project-thread-5y3wlk"]
    paths: ["crash-dashboard/fetch.py", ".github/workflows/crash-data-probe.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python crash-dashboard/fetch.py
      - run: |
          git config user.name "crash-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crash-dashboard/raw
          git commit -m "Raw crash-dashboard series" || echo "nothing new"
          git push
